<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOCAL ATLAS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --paper: #fbf8f3; --surface: #ffffff; --sand: #f3eee6; --line: #ebe4d8; --line-strong: #ddd3c2;
    --ink: #1d2523; --ink-2: #3a4442; --muted: #6b7573;
    --primary: #0e5a57; --primary-soft: #e3f1ef;
    --accent: #c4532d; --accent-strong: #a8431f; --accent-soft: #fbece5;
    --sans: "Pretendard Variable", "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    --serif: "Noto Serif KR", "Nanum Myeongjo", Georgia, serif;
    --r-sm: 10px; --r-md: 16px; --r-lg: 24px;
    --shadow-1: 0 1px 2px rgba(29,37,35,.05), 0 1px 1px rgba(29,37,35,.04);
    --shadow-float: 0 2px 6px rgba(29,37,35,.06), 0 18px 48px -12px rgba(29,37,35,.22);
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  #map { position: fixed; inset: 0; }

  /* ---------- 떠 있는 패널 ---------- */
  .panel {
    position: fixed; top: 16px; left: 16px; bottom: 16px; width: 404px; z-index: 5;
    display: flex; flex-direction: column;
    background: rgba(255,255,255,.94); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border: 1px solid rgba(255,255,255,.7); border-radius: var(--r-lg); box-shadow: var(--shadow-float); overflow: hidden;
  }
  .panel-top { padding: 22px 22px 14px; }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .brand h1 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: 19px; letter-spacing: .22em; }
  .brand .region { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .brand .region svg { width: 13px; height: 13px; }

  .seg { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; background: var(--sand); border-radius: 12px; padding: 4px; position: relative; }
  .seg button { position: relative; z-index: 1; height: 38px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; transition: color .2s; }
  .seg button[aria-selected="true"] { color: var(--ink); }
  .seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); background: var(--surface); border-radius: 9px; box-shadow: var(--shadow-1); transition: transform .3s var(--ease); }
  .seg[data-tab="routes"] .thumb { transform: translateX(100%); }

  .panel-body { flex: 1; overflow-y: auto; padding: 0 22px 22px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .panel-foot { padding: 10px 22px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; line-height: 1.5; background: rgba(251,248,243,.7); }
  .panel-foot .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex: none; }

  /* ---------- 검색·필터 ---------- */
  .search { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; color: var(--muted); transition: border-color .2s, box-shadow .2s; }
  .search:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
  .search input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; color: var(--ink); }
  .search input::placeholder { color: #9aa3a1; }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin: 12px -22px 0; padding: 0 22px 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--ink-2); transition: all .2s; }
  .chip .sw { width: 8px; height: 8px; border-radius: 50%; }
  .chip:hover { border-color: var(--line-strong); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .list-head { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }

  /* ---------- 장소 목록 ---------- */
  .row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 11px 10px; margin: 0 -10px; width: calc(100% + 20px); border-radius: 14px; text-align: left; transition: background .15s; }
  .row:hover { background: var(--sand); }
  .row.active { background: var(--primary-soft); }
  .tile { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; }
  .tile svg.i { width: 20px; height: 20px; }
  .row-main { flex: 1; min-width: 0; }
  .row-main strong { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-main span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .row > svg.i { color: #b4bab8; width: 16px; height: 16px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }

  /* ---------- 장소 상세 ---------- */
  .back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); padding: 6px 0; margin-bottom: 10px; }
  .back:hover { color: var(--ink); }
  .hero { position: relative; height: 150px; border-radius: 18px; overflow: hidden; display: flex; align-items: flex-end; padding: 16px; color: #fff; }
  .hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 90% at 85% 10%, rgba(255,255,255,.28), transparent 55%), repeating-linear-gradient(135deg, rgba(255,255,255,.06) 0 2px, transparent 2px 14px); }
  .hero .big { position: absolute; right: 18px; top: 18px; opacity: .9; }
  .hero .big svg.i { width: 44px; height: 44px; stroke-width: 1.4; }
  .badge { position: relative; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.22); backdrop-filter: blur(6px); }
  .detail h2 { font-family: var(--serif); font-size: 26px; font-weight: 700; margin: 20px 0 2px; letter-spacing: -0.02em; }
  .detail .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .detail .desc { line-height: 1.7; color: var(--ink-2); margin: 0 0 18px; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .facts div { background: var(--surface); padding: 12px; }
  .facts dt { font-size: 11px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .facts dt svg.i { width: 12px; height: 12px; }
  .facts dd { margin: 4px 0 0; font-size: 13.5px; font-weight: 600; }
  .facts .wide { grid-column: 1 / -1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .tags span { font-size: 12.5px; color: var(--ink-2); background: var(--sand); padding: 5px 11px; border-radius: 999px; }
  .section-title { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin: 26px 0 10px; }
  .in-route { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; transition: border-color .2s, background .2s; }
  .in-route:hover { border-color: var(--accent); background: var(--accent-soft); }
  .in-route .step { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; flex: none; }
  .in-route strong { flex: 1; font-size: 14px; font-weight: 600; }
  .in-route svg.i { color: var(--accent); width: 16px; }

  /* ---------- 코스 ---------- */
  .intro { font-size: 13px; color: var(--muted); margin: 4px 0 14px; line-height: 1.5; }
  .route { display: block; width: 100%; text-align: left; padding: 18px; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; margin-bottom: 10px; transition: border-color .2s, box-shadow .2s; }
  .route:hover { border-color: var(--line-strong); }
  .route.active { border-color: transparent; box-shadow: 0 0 0 2px var(--accent), var(--shadow-1); }
  .route .theme { font-size: 11.5px; font-weight: 700; color: var(--accent-strong); letter-spacing: .02em; }
  .route h3 { font-family: var(--serif); font-size: 18.5px; font-weight: 700; margin: 6px 0 6px; letter-spacing: -0.02em; }
  .route p { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.6; }
  .stats { display: flex; gap: 14px; margin-top: 12px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .stats span { display: inline-flex; align-items: center; gap: 5px; }
  .stats svg.i { width: 14px; height: 14px; color: var(--muted); }

  .timeline { list-style: none; margin: 4px 0 18px; padding: 0; }
  .stop { position: relative; }
  .stop-btn { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 10px; margin-left: -10px; width: calc(100% + 20px); border-radius: 14px; transition: background .15s; }
  .stop-btn:hover { background: var(--sand); }
  .stop.active .stop-btn { background: var(--accent-soft); }
  .stop .n { width: 30px; height: 30px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); color: var(--accent-strong); font-weight: 700; font-size: 13px; display: grid; place-items: center; flex: none; position: relative; z-index: 1; }
  .stop.active .n { background: var(--accent); color: #fff; }
  .leg { display: flex; align-items: center; gap: 6px; margin-left: 34px; height: 26px; padding-left: 26px; font-size: 11.5px; color: var(--muted); position: relative; }
  .leg::before { content: ""; position: absolute; left: -10px; top: -6px; bottom: -6px; border-left: 2px dashed #e4b8a6; }
  .leg svg.i { width: 12px; height: 12px; }

  /* ---------- 지도 위 요소 ---------- */
  .lang { position: fixed; top: 16px; right: 16px; z-index: 5; display: flex; padding: 4px; gap: 2px; background: rgba(255,255,255,.94); backdrop-filter: blur(12px); border-radius: 999px; box-shadow: var(--shadow-float); }
  .lang button { height: 32px; min-width: 42px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
  .lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .maplibregl-ctrl-top-right { top: 64px; right: 6px; }
  .maplibregl-ctrl-group { border-radius: 14px !important; box-shadow: var(--shadow-float) !important; overflow: hidden; }
  .maplibregl-ctrl-group button { width: 38px; height: 38px; }

  .marker { width: 32px; height: 32px; border-radius: 50%; border: 2.5px solid #fff; color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 6px rgba(29,37,35,.3); transition: transform .2s var(--ease), opacity .2s; }
  .marker svg.i { width: 15px; height: 15px; stroke-width: 2.2; }
  .marker:hover { transform: scale(1.12); }
  .marker.active { transform: scale(1.3); box-shadow: 0 0 0 5px rgba(255,255,255,.7), 0 4px 14px rgba(29,37,35,.35); }
  .marker.dim { opacity: .22; transform: scale(.75); }
  .marker.step { background: var(--accent) !important; font-weight: 800; font-size: 13px; }
  .maplibregl-popup-content { border-radius: 14px; padding: 10px 14px; font-family: var(--sans); box-shadow: var(--shadow-float); }
  .maplibregl-popup-tip { display: none; }
  .pop strong { display: block; font-size: 14px; font-weight: 700; }
  .pop span { font-size: 12px; color: var(--muted); }

  /* ---------- 모바일: 하단 시트 ---------- */
  @media (max-width: 760px) {
    .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 58vh; border-radius: 22px; }
    .panel::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 4px; background: var(--line-strong); margin: 8px auto 0; }
    .panel-top { padding: 12px 16px 12px; }
    .panel-body { padding: 0 16px 16px; }
    .chips { margin: 12px -16px 0; padding: 0 16px 2px; }
    .panel-foot { display: none; }
    .lang { top: 12px; right: 12px; }
    .maplibregl-ctrl-top-right { top: 56px; }
    .hero { height: 120px; }
  }
</style>
</head>
<body>
<div id="map"></div>

<section class="panel" aria-label="LOCAL ATLAS">
  <div class="panel-top">
    <div class="brand">
      <h1>LOCAL ATLAS</h1>
      <span class="region" data-icon="pin"><span id="region"></span></span>
    </div>
    <nav class="seg" role="tablist" data-tab="places">
      <span class="thumb"></span>
      <button role="tab" data-tab="places" aria-selected="true"><span data-icon="compass"></span><span data-i18n="tabPlaces"></span></button>
      <button role="tab" data-tab="routes" aria-selected="false"><span data-icon="route"></span><span data-i18n="tabRoutes"></span></button>
    </nav>
  </div>
  <div class="panel-body" id="panel"></div>
  <div class="panel-foot"><span class="dot"></span><span data-i18n="banner"></span></div>
</section>

<div class="lang">
  <button data-lang="ko" aria-pressed="true">KO</button>
  <button data-lang="en" aria-pressed="false">EN</button>
</div>

const state = { lang: "ko", tab: "places", category: "all", query: "", openId: null, routeId: null };
const catById = Object.fromEntries(DATA.categories.map(c => [c.id, c]));
const placeById = Object.fromEntries(DATA.places.map(p => [p.id, p]));
const themeById = Object.fromEntries(DATA.themes.map(th => [th.id, th]));
const t = key => I18N[state.lang][key];
const L = (obj, base) => obj[base + (state.lang === "ko" ? "Ko" : "En")];

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "style") node.style.cssText = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}

// 두 지점 사이 직선거리(km)와 도보 시간(분, 4.5km/h · 곡선 보정 1.25)
function distKm(a, b) {
  const R = 6371, rad = d => d * Math.PI / 180;
  const dLat = rad(b.latitude - a.latitude), dLng = rad(b.longitude - a.longitude);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.latitude)) * Math.cos(rad(b.latitude)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h)) * 1.25;
}
const walkMin = km => Math.max(1, Math.round(km / 4.5 * 60));
function routeStats(r) {
  const ps = r.placeIds.map(id => placeById[id]);
  let km = 0;
  for (let i = 1; i < ps.length; i++) km += distKm(ps[i - 1], ps[i]);
  const stay = ps.reduce((s, p) => s + p.recommendedDurationMinutes, 0);
  return { km, total: stay + walkMin(km) };
}

// ---- 지도 ----
const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/positron",
  center: CENTER,
  zoom: 14.5,
  attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
map.addControl(new maplibregl.GeolocateControl({}), "top-right");
// 데스크톱에서 떠 있는 패널에 가리지 않도록 지도 중심을 오른쪽으로 민다.
const isDesktop = () => window.matchMedia("(min-width: 761px)").matches;
const mapPadding = () => isDesktop() ? { left: 440, top: 40, right: 60, bottom: 40 } : { left: 30, right: 30, top: 70, bottom: window.innerHeight * 0.58 + 20 };

const markers = {};
const popup = new maplibregl.Popup({ offset: 22, closeButton: false });
for (const p of DATA.places) {
  const node = el("div", { class: "marker" });
  node.addEventListener("click", e => { e.stopPropagation(); selectPlace(p.id, true); });
  markers[p.id] = { node, marker: new maplibregl.Marker({ element: node }).setLngLat([p.longitude, p.latitude]).addTo(map) };
}

function showPopup(p) {
  const box = el("div", { class: "pop" }, el("strong", {}, L(p, "name")),
    el("span", {}, `${L(catById[p.category], "label")} · ${t("minutes")(p.recommendedDurationMinutes)}`));
  popup.setLngLat([p.longitude, p.latitude]).setDOMContent(box).addTo(map);
}

function filteredPlaces() {
  const q = state.query.trim().toLowerCase();
  return DATA.places.filter(p =>
    (state.category === "all" || p.category === state.category) &&
    (!q || [p.nameKo, p.nameEn, ...p.tags].some(s => s.toLowerCase().includes(q))));
}

const currentRoute = () => state.tab === "routes" ? DATA.routes.find(r => r.routeId === state.routeId) : null;

function updateMarkers() {
  const route = currentRoute();
  const visible = new Set(state.tab === "places" ? filteredPlaces().map(p => p.id) : route ? route.placeIds : DATA.places.map(p => p.id));
  for (const [id, { node }] of Object.entries(markers)) {
    const step = route ? route.placeIds.indexOf(id) : -1;
    node.className = "marker" + (step >= 0 ? " step" : "") + (!visible.has(id) ? " dim" : "") + (state.openId === id ? " active" : "");
    node.style.background = catById[placeById[id].category].color;
    node.replaceChildren(step >= 0 ? String(step + 1) : icon(placeById[id].category));
    node.style.zIndex = state.openId === id ? 3 : step >= 0 ? 2 : 1;
  }
  drawRouteLine(route);
}

// isStyleLoaded()는 타일 로딩 중에도 false라서, load 이벤트 기준 플래그를 따로 둔다.
let mapReady = false;
let fittedRouteId = null;
function drawRouteLine(route) {
  const coords = route ? route.placeIds.map(id => [placeById[id].longitude, placeById[id].latitude]) : [];
  if (mapReady) {
    const geojson = { type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: coords } };
    if (map.getSource("route")) map.getSource("route").setData(geojson);
    else {
      map.addSource("route", { type: "geojson", data: geojson });
      const layout = { "line-join": "round", "line-cap": "round" };
      map.addLayer({ id: "route-casing", type: "line", source: "route", layout,
        paint: { "line-color": "#ffffff", "line-width": 9, "line-opacity": .9 } });
      map.addLayer({ id: "route", type: "line", source: "route", layout,
        paint: { "line-color": "#c4532d", "line-width": 4 } });
    }
  }
  // 코스가 바뀔 때만 전체가 보이게 맞춘다 (코스 안 장소를 눌렀을 때 flyTo를 덮어쓰지 않도록).
  const id = route ? route.routeId : null;
  if (id !== fittedRouteId) {
    fittedRouteId = id;
    if (route) {
      const b = new maplibregl.LngLatBounds();
      coords.forEach(c => b.extend(c));
      map.fitBounds(b, { padding: mapPadding(), maxZoom: 16, duration: 900 });
    }
  }
}
function fitAll(duration) {
  const b = new maplibregl.LngLatBounds();
  DATA.places.forEach(p => b.extend([p.longitude, p.latitude]));
  map.fitBounds(b, { padding: mapPadding(), maxZoom: 16, duration });
}
fitAll(0);
map.on("load", () => { mapReady = true; updateMarkers(); });
map.on("click", () => { if (state.openId) { state.openId = null; popup.remove(); render(); } });

function selectPlace(id, fromMap) {
  const route = currentRoute();
  // 코스 탭에서 코스 밖 장소를 누르면 장소 탐색 상세로 넘어간다.
  if (state.tab === "routes" && fromMap && !(route && route.placeIds.includes(id))) state.tab = "places";
  if (state.tab === "places" && fromMap) { state.category = "all"; state.query = ""; }
  state.openId = state.openId === id && !fromMap && state.tab === "routes" ? null : id;
  const p = placeById[id];
  if (state.openId) {
    map.flyTo({ center: [p.longitude, p.latitude], zoom: Math.max(map.getZoom(), 15.8), padding: mapPadding(), duration: 800 });
    showPopup(p);
  } else popup.remove();
  render(true);
}

function openRoute(routeId) {
  state.tab = "routes"; state.routeId = routeId; state.openId = null; popup.remove();
  render(true);
}

function catTile(c) {
  const tile = el("div", { class: "tile", style: `background:${c.color}1a;color:${c.color}` });
  tile.append(icon(c.id));
  return tile;
}

function renderPlaces(panel) {
  if (state.openId) return renderDetail(panel, placeById[state.openId]);

  const input = el("input", { type: "search", placeholder: t("search"), "aria-label": t("search") });
  input.value = state.query;
  input.addEventListener("input", () => { state.query = input.value; renderList(); updateMarkers(); });
  panel.append(el("label", { class: "search" }, icon("search"), input));

  const chips = el("div", { class: "chips" });
  for (const c of [{ id: "all" }, ...DATA.categories]) {
    chips.append(el("button", { class: "chip", "aria-pressed": String(state.category === c.id),
      onclick: () => { state.category = c.id; render(); } },
      c.id === "all" ? null : el("span", { class: "sw", style: `background:${c.color}` }),
      c.id === "all" ? t("all") : L(c, "label")));
  }
  panel.append(chips);
  panel.append(el("div", { id: "list" }));
  renderList();
}

function renderList() {
  const list = document.getElementById("list");
  const items = filteredPlaces();
  list.replaceChildren(el("div", { class: "list-head" }, el("span", {}, t("places")), el("span", {}, t("count")(items.length))),
    ...(items.length ? items.map(p => {
      const c = catById[p.category];
      return el("button", { class: "row", onclick: () => selectPlace(p.id, false),
        onmouseenter: () => markers[p.id].node.classList.add("active"),
        onmouseleave: () => state.openId !== p.id && markers[p.id].node.classList.remove("active") },
        catTile(c),
        el("div", { class: "row-main" }, el("strong", {}, L(p, "name")),
          el("span", {}, `${L(c, "label")} · ${t("minutes")(p.recommendedDurationMinutes)}`)),
        icon("chevron"));
    }) : [el("p", { class: "empty" }, t("empty"))]));
}

function renderDetail(panel, p) {
  const c = catById[p.category];
  const hero = el("div", { class: "hero", style: `background:linear-gradient(135deg, ${c.color}, ${c.color}cc 60%, #1d2523)` },
    el("span", { class: "big" }, icon(c.id)),
    el("span", { class: "badge" }, L(c, "label") + (p.isSample ? ` · ${t("sample")}` : "")));
  const facts = el("dl", { class: "facts" },
    el("div", {}, el("dt", {}, icon("clock"), t("hours")), el("dd", {}, p.openingHours || "—")),
    el("div", {}, el("dt", {}, icon("walk"), t("duration")), el("dd", {}, t("minutes")(p.recommendedDurationMinutes))),
    el("div", {}, el("dt", {}, icon("compass"), t("theme")), el("dd", {}, L(themeById[p.theme] || { labelKo: "—", labelEn: "—" }, "label"))),
    el("div", { class: "wide" }, el("dt", {}, icon("pin"), t("address")), el("dd", {}, p.address)));
  panel.append(
    el("button", { class: "back", onclick: () => { state.openId = null; popup.remove(); render(true); } }, icon("back"), t("back")),
    el("article", { class: "detail" }, hero,
      el("h2", {}, L(p, "name")),
      el("p", { class: "sub" }, state.lang === "ko" ? p.nameEn : p.nameKo),
      el("p", { class: "desc" }, L(p, "description")),
      facts,
      el("div", { class: "tags" }, ...p.tags.map(tag => el("span", {}, "#" + tag)))));

  const routes = DATA.routes.filter(r => r.placeIds.includes(p.id));
  if (routes.length) {
    panel.append(el("div", { class: "section-title" }, t("inRoutes")));
    for (const r of routes) {
      panel.append(el("button", { class: "in-route", onclick: () => openRoute(r.routeId) },
        el("span", { class: "step" }, String(r.placeIds.indexOf(p.id) + 1)),
        el("strong", {}, L(r, "title")), icon("chevron")));
    }
  }
}

// ---- 패널: 코스 ----
function renderRoutes(panel) {
  panel.append(el("p", { class: "intro" }, t("intro")));
  for (const r of DATA.routes) {
    const s = routeStats(r);
    const active = state.routeId === r.routeId;
    panel.append(el("button", { class: "route" + (active ? " active" : ""),
      onclick: () => { state.routeId = r.routeId; state.openId = null; popup.remove(); render(); } },
      el("div", { class: "theme" }, L(themeById[r.theme] || { labelKo: "", labelEn: "" }, "label")),
      el("h3", {}, L(r, "title")),
      el("p", {}, L(r, "description")),
      el("div", { class: "stats" },
        el("span", {}, icon("pin"), t("stops")(r.placeIds.length)),
        el("span", {}, icon("ruler"), t("km")(s.km)),
        el("span", {}, icon("clock"), t("total")(s.total)))));
    if (active) panel.append(timeline(r));
  }
}

function timeline(r) {
  const ol = el("ol", { class: "timeline" });
  r.placeIds.forEach((id, i) => {
    const p = placeById[id], c = catById[p.category];
    if (i > 0) {
      const km = distKm(placeById[r.placeIds[i - 1]], p);
      ol.append(el("li", { class: "leg", "aria-hidden": "true" }, icon("walk"), t("walk")(km, walkMin(km))));
    }
    ol.append(el("li", { class: "stop" + (state.openId === id ? " active" : ""), "data-place": id },
      el("button", { class: "stop-btn", onclick: () => selectPlace(id, false) },
        el("span", { class: "n" }, String(i + 1)),
        el("div", { class: "row-main" }, el("strong", {}, L(p, "name")),
          el("span", {}, `${L(c, "label")} · ${t("minutes")(p.recommendedDurationMinutes)}`)),
        icon("chevron"))));
  });
  return ol;
}

function render(resetScroll) {
  document.documentElement.lang = state.lang;
  document.getElementById("region").textContent = t("region");
  document.querySelectorAll("[data-i18n]").forEach(n => n.textContent = t(n.dataset.i18n));
  document.querySelector(".seg").dataset.tab = state.tab;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  const panel = document.getElementById("panel");
  const scroll = panel.scrollTop;
  panel.replaceChildren();
  (state.tab === "places" ? renderPlaces : renderRoutes)(panel);
  panel.scrollTop = resetScroll && state.tab === "places" ? 0 : scroll;
  if (state.tab === "routes" && state.openId) panel.querySelector(`[data-place="${state.openId}"]`)?.scrollIntoView({ block: "nearest", behavior: "smooth" });
  updateMarkers();
}

document.querySelectorAll("[data-icon]").forEach(n => n.prepend(icon(n.dataset.icon)));
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  if (state.tab === b.dataset.tab) return;
  state.tab = b.dataset.tab; state.openId = null; popup.remove();
  if (state.tab === "routes" && !state.routeId) state.routeId = DATA.routes[0].routeId;
  if (state.tab === "places") fitAll(800);
  render(true);
}));
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { state.lang = b.dataset.lang; render(); }));
render();
</script>
</body>
</html>
